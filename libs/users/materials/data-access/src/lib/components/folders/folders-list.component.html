  <div *ngIf="loading$ | async; else folderList" class="loading-container">
    <mat-spinner></mat-spinner>
  </div>

  <ng-template #folderList>
    <div class="folders-container">
      <mat-card
        class="folder-card"
        *ngFor="let folder of folders$ | async"
        (click)="openFolder(folder.id)"
      >
        <mat-icon class="folder-icon">folders</mat-icon>
        <div class="folder-title">{{ folder.title }}</div>
         
      </mat-card>
    </div>
  </ng-template>

<button mat-fab color="primary" class="add-folder-btn" (click)="openAddFolderDialog()">
  <mat-icon>+</mat-icon>
</button>
